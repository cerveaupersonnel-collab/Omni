name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Flutter installation
        run: flutter --version && dart --version

      - name: Create the Android project
        run: flutter create --org com.omni --project-name omni --platforms=android . && rm -f test/widget_test.dart

      - name: Firebase files (stub)
        run: bash tools/ci_firebase_files.sh

      - name: Native patch
        run: bash tools/apply_android_patch.sh

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=OMNI_SKIP_INTEGRITY=true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: omni-debug-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

