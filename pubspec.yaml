name: omni
description: OMNI - One App. For Everything.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  cloud_functions: ^5.0.1
  firebase_app_check: ^0.5.0
  in_app_purchase: ^3.2.0
  in_app_purchase_android: ">=0.4.0 <1.0.0"
  google_mobile_ads: ^5.1.0
  google_sign_in: ^6.2.1
  url_launcher: ^6.3.0
  # Phase 4
  cunning_document_scanner: ^1.2.3
  google_mlkit_text_recognition: ^0.13.0
  pdf: ^3.11.0
  share_plus: ^9.0.0
  file_picker: ^8.0.0
  image_picker: ^1.1.2
  local_auth: ^2.2.0
  video_player: ^2.8.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
